name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Run the TS suite on both OSes too — same reasoning as bats: macOS
        # tar / shell quirks are real and worth catching pre-merge.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin the toolchain, not just the action ref. A SHA-pinned action
          # still installs whatever `latest` resolves to at run time; reading
          # the version from .bun-version freezes the actual Bun binary too.
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace + plugin manifests
        # validate is offline (no API call / no auth needed); --strict fails on
        # unrecognized fields and missing metadata.
        run: claude plugin validate . --strict
      - name: Manifest invariants
        # Project guards (formerly tests/manifest.bats): exactly one plugin,
        # named iago, and no standalone squawk plugin. jq -e exits non-zero on
        # a false/null result.
        run: |
          jq -e '.plugins | length == 1' .claude-plugin/marketplace.json
          jq -e '.plugins[0].name == "iago"' .claude-plugin/marketplace.json
          jq -e '[.plugins[].name] | index("squawk") | not' .claude-plugin/marketplace.json
